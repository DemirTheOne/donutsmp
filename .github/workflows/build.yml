name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build
        working-directory: donutmod-repo/donutmod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: donutmod-jar
          path: |
            donutmod-repo/donutmod/build/libs/*.jar
            !donutmod-repo/donutmod/build/libs/*-sources.jar
